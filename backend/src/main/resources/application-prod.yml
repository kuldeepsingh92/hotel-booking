# Production profile — every security control is at its strictest.
# Secrets MUST come from the environment / secret manager; startup fails if absent.
laorvia:
  security:
    allow-ephemeral-kek: false
    demo-login-enabled: false
    tls-required: true
    trusted-proxy-count: ${LAORVIA_TRUSTED_PROXY_COUNT:1}
    ip-binding-mode: STRICT
    key-ttl-seconds: 900
    clock-skew-seconds: 45
    allowed-origins: https://laorvia.com,https://www.laorvia.com

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  data:
    redis:
      ssl:
        enabled: true
