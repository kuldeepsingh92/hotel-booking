<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Defence-in-depth. In production move this to a real HTTP header with a build-specific script hash. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.pexels.com https://tile.openstreetmap.org; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#235444" />

    <!-- Primary SEO Meta Tags -->
    <title>Laorvia — India's Most Transparent Hotel Booking Platform | All-Inclusive GST Upfront</title>
    <meta
      name="description"
      content="Book handpicked heritage palaces, lakefront havelis, Goan Portuguese villas, and Himalayan chalets across India on Laorvia. 100% upfront GST pricing, ₹0 platform convenience fee, instant UPI payment, and direct host chat."
    />
    <meta
      name="keywords"
      content="hotel booking India, heritage hotels Udaipur, Goa Portuguese villas, luxury resorts India, no hidden GST hotel booking, UPI hotel payment, Laorvia hotels, best hotel deals India, Jain food hotel booking"
    />
    <link rel="canonical" href="https://laorvia.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Geo Location Meta for India -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="language" content="English, Hindi" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laorvia" />
    <meta property="og:title" content="Laorvia — Handpicked Indian Stays, Zero Hidden GST" />
    <meta
      property="og:description"
      content="Tired of surprise 18% GST and convenience fees at checkout? Discover verified heritage havelis, beach villas and mountain chalets with 100% upfront pricing and zero booking fee."
    />
    <meta property="og:url" content="https://laorvia.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://images.pexels.com/photos/33658452/pexels-photo-33658452.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200" />
    <meta property="og:image:alt" content="Udaipur City Palace and Lake Pichola at twilight on Laorvia" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@laorvia" />
    <meta name="twitter:title" content="Laorvia — India's Fair-Price Hotel Discovery Platform" />
    <meta
      name="twitter:description"
      content="Handpicked stays across India with transparent GST-included pricing, instant UPI payment, and verified guest reviews."
    />
    <meta name="twitter:image" content="https://images.pexels.com/photos/33658452/pexels-photo-33658452.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200" />

    <!-- Brand Favicon: Modern Architectural Heritage Arch in Emerald & Gold -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23235444'/%3E%3Cpath d='M7 26V15.5C7 10.8 11 7 16 7s9 3.8 9 8.5V26' stroke='%23faf7f2' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M12 26V18a4 4 0 0 1 8 0v8z' fill='%23faf7f2'/%3E%3Ccircle cx='16' cy='12' r='1.8' fill='%23c4912f'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts Preconnect & High-E-E-A-T Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD): WebSite + TravelAgency + Sitelinks SearchBox for AI & Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://laorvia.com/#website",
            "url": "https://laorvia.com/",
            "name": "Laorvia",
            "description": "India's Most Transparent Hotel Booking Platform with Zero Drip Pricing and 100% Upfront GST",
            "inLanguage": "en-IN",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://laorvia.com/#/search?dest={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "TravelAgency",
            "@id": "https://laorvia.com/#organization",
            "name": "Laorvia",
            "legalName": "Laorvia Hospitality India Private Limited",
            "url": "https://laorvia.com/",
            "logo": "https://laorvia.com/icon.svg",
            "description": "Curated hotel booking platform in India featuring heritage palaces, Goan Portuguese villas, and Himalayan chalets with all-inclusive GST pricing.",
            "currenciesAccepted": "INR",
            "paymentAccepted": "UPI, Google Pay, PhonePe, Paytm, RuPay, NetBanking, Credit Card, Debit Card",
            "areaServed": {
              "@type": "Country",
              "name": "India"
            },
            "priceRange": "₹3,500 - ₹35,000",
            "knowsAbout": [
              "Heritage Hotels in Rajasthan",
              "Boutique Villas in Goa",
              "Munnar Plantation Bungalows",
              "Hotel GST Regulations in India",
              "Jain and Pure Veg Hotel Stays"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://laorvia.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does Laorvia add 18% GST or convenience fees at checkout?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Every rate displayed on Laorvia already includes applicable 12% or 18% hotel GST and local fees. There are zero platform convenience fees and zero payment gateway surcharges."
                }
              },
              {
                "@type": "Question",
                "name": "Can I pay using UPI (Google Pay, PhonePe, Paytm) on Laorvia?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, Laorvia natively supports instant UPI payment with zero extra transaction fees. You can also pay via RuPay, Visa, Mastercard, NetBanking, or select Pay at Hotel on flexible rates."
                }
              },
              {
                "@type": "Question",
                "name": "Can I make special dietary requests like Pure Vegetarian or Jain meals on Laorvia?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, you can select Pure Veg or Jain meal preparation during checkout at zero extra cost, and chat directly with the property host to coordinate your preferences."
                }
              },
              {
                "@type": "Question",
                "name": "What ID is required at hotel check-in in India?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "All adult guests must carry an original government-issued photo ID (Aadhaar Card, Passport, Voter ID, or Driving License). Under Indian hotel regulations, PAN cards are generally not accepted as address proof."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
